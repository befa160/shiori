name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS est « si possible » (principe 9) : il est testé mais ne bloque pas.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup lit backend/rust-toolchain.toml (stable + clippy + rustfmt).
      - name: Toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Seuils obligatoires (CLAUDE.md, « Couverture de tests ») : lignes ET branches.
      MIN_LINES: 80
      MIN_BRANCHES: 80
      # Versions figées : un nightly ou un outil cassé ne doit pas bloquer toutes les PR.
      # À monter à la main de temps en temps.
      NIGHTLY: nightly-2026-11-10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # La couverture des branches (`--branch`) n'existe encore que sur nightly.
      - name: Toolchain nightly
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component llvm-tools
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          key: coverage
      - name: Mesure
        run: >-
          cargo +${{ env.NIGHTLY }} llvm-cov --workspace --locked --branch
          --ignore-filename-regex '(/tests\.rs|/tests/|shiori-testkit/)'
          --json --summary-only --output-path coverage.json
      - name: Seuils
        run: |
          read -r lines lcount branches bcount < <(jq -r '.data[0].totals
            | "\(.lines.percent) \(.lines.count) \(.branches.percent) \(.branches.count)"' coverage.json)
          echo "lignes : ${lines} % (${lcount}) | branches : ${branches} % (${bcount})"
          echo "### Couverture : lignes ${lines} %, branches ${branches} %" >> "$GITHUB_STEP_SUMMARY"
          ok=1
          awk -v v="$lines" -v m="$MIN_LINES" 'BEGIN { exit !(v >= m) }' \
            || { echo "::error::couverture des lignes ${lines} % < ${MIN_LINES} %"; ok=0; }
          if [ "$bcount" -gt 0 ]; then
            awk -v v="$branches" -v m="$MIN_BRANCHES" 'BEGIN { exit !(v >= m) }' \
              || { echo "::error::couverture des branches ${branches} % < ${MIN_BRANCHES} %"; ok=0; }
          fi
          [ "$ok" = 1 ]

  # Failles connues (base RustSec) dans les crates de Cargo.lock : une PR Dependabot par
  # semaine relance ce job, et donc la vérification, même sans changement de code.
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      - run: cargo deny check advisories

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Seuils de couverture (80 % lignes et branches) dans vite.config.ts.
      - run: npm run coverage
      - run: npm run build

  # Lecteur dans Chromium contre un vrai `shiori serve` (Q16) : invariant de lecture vérifié
  # sur chaque page affichée, reprise, tome suivant, captures aux quatre tailles.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        working-directory: backend
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
          key: e2e
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-captures
          path: |
            web/e2e/captures
            web/test-results
          if-no-files-found: ignore
