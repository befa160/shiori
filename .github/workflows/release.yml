name: Release

# Binaires (Q37) et image Docker (Q36) publiés sur un tag `v*`. Une PR qui modifie ce fichier,
# le Dockerfile ou les dépendances Rust construit tout sans rien publier.
on:
  push:
    tags: ['v*']
  pull_request:
    # Les dépendances Rust aussi : une crate qui ne compile plus en musl se voit dans sa PR.
    paths: [.github/workflows/release.yml, Dockerfile, backend/Cargo.lock]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Le front n'est construit qu'une fois, puis intégré à chaque binaire (rust-embed).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl : binaires statiques, qui tournent sur toute distribution et dans l'image
          # Docker distroless. aarch64 sur un runner ARM natif, sans compilation croisée.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      # `allow_missing` laisserait compiler un binaire sans interface : on refuse ici.
      - run: test -f web/dist/index.html
      - name: musl
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          # SQLite et ring compilent du C : avec le compilateur musl, pas celui de la glibc.
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}
      - name: Build
        working-directory: backend
        run: |
          rustup target add "$TARGET"
          # Le numéro de release exact (`0.5.0-rc.2`) montré par l'application ; rien hors d'un tag.
          if [[ $GITHUB_REF == refs/tags/v* ]]; then export SHIORI_RELEASE=${GITHUB_REF_NAME#v}; fi
          cargo build --release --locked -p shiori --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Check and package
        run: |
          exe=shiori; [[ $TARGET == *windows* ]] && exe=shiori.exe
          bin="backend/target/$TARGET/release/$exe"
          version=$("$bin" --version | cut -d' ' -f2)
          echo "$bin $version"
          if [[ $TARGET == *musl ]]; then file "$bin" | grep -q 'static'; fi
          # Un tag v0.1.0-rc.1 publie le code de la version 0.1.0.
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            tag=${GITHUB_REF_NAME#v}
            test "${tag%%-*}" = "$version"
          fi
          name="shiori-$version-$TARGET"
          mkdir -p "dist/$name"
          cp "$bin" LICENSE README.md "dist/$name/"
          cd dist
          if [[ $TARGET == *windows* ]]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
          rm -r "$name"
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    # Pas de release sans son image : un test Docker raté arrête tout.
    needs: [build, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Attestations de provenance : signées par Sigstore, sans clé à garder, vérifiables avec
      # `gh attestation verify <archive> -R befa160/shiori`.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: '*-*-*' # les binaires des cibles, pas web-dist
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/shiori-*
      - name: Release
        working-directory: dist
        run: |
          sha256sum shiori-* > SHA256SUMS
          cat SHA256SUMS
          # Release créée dans l'interface de GitHub (qui crée le tag) : on y ajoute les fichiers,
          # titre et notes gardés. Sinon (`git push` du tag) : on la crée.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber shiori-* SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --generate-notes shiori-* SHA256SUMS
          fi
          # Un tag avec suffixe (v0.1.0-rc.1) est toujours une préversion, même si la case a été
          # oubliée dans l'interface (elle ne doit pas devenir « Latest »).
          if [[ $GITHUB_REF_NAME == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # Image multi-architecture à partir des binaires musl, essayée avant d'être poussée.
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: '*-unknown-linux-musl'
          merge-multiple: true
      - name: Context
        run: |
          mkdir -p ctx/amd64 ctx/arm64 ctx/empty
          tar xzf artifacts/*-x86_64-unknown-linux-musl.tar.gz -C ctx/amd64 --strip-components=1 --wildcards '*/shiori'
          tar xzf artifacts/*-aarch64-unknown-linux-musl.tar.gz -C ctx/arm64 --strip-components=1 --wildcards '*/shiori'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ctx
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: shiori:test
      - name: Smoke test
        run: |
          docker run -d --name shiori -p 127.0.0.1:7878:7878 shiori:test
          for _ in $(seq 30); do curl -sf localhost:7878/api/health && break; sleep 1; done
          curl -sf localhost:7878/ | grep -q '<title>Shiori</title>'
          # Parade au DNS rebinding active dans le conteneur.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' localhost:7878/api/health)" = 403
          # HEALTHCHECK déclaré, et sa commande répond dans l'image (distroless : pas de curl).
          docker inspect -f '{{json .Config.Healthcheck.Test}}' shiori | grep -q '"health"'
          docker exec shiori /usr/local/bin/shiori health
          # `docker stop` envoie SIGTERM : arrêt propre (0), pas tué au bout du délai (137).
          docker stop -t 5 shiori
          docker logs shiori
          test "$(docker inspect -f '{{.State.ExitCode}}' shiori)" = 0
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # 0.1.0 et 0.1 ; latest seulement pour une version finale (pas v0.1.0-rc.1).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ctx
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Vérifiable avec `gh attestation verify oci://ghcr.io/befa160/shiori:<version> -R befa160/shiori`.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
