# Exemple pour lancer Shiori avec Docker Compose : décommentez la ligne de vos bibliothèques,
# `docker compose up -d`, puis http://localhost:7878. L'API n'a pas d'authentification : ne
# l'ouvrez pas au-delà d'un réseau de confiance (voir la documentation d'installation, reverse
# proxy avec mot de passe).
services:
  shiori:
    image: ghcr.io/befa160/shiori:latest
    restart: unless-stopped
    ports:
      # Seulement depuis cette machine ; « 7878:7878 » pour le réseau local.
      - "127.0.0.1:7878:7878"
    environment:
      # Noms par lesquels vous ouvrez Shiori, séparés par des virgules (localhost est toujours
      # accepté), par exemple « localhost,shiori.lan,192.168.1.10 ».
      SHIORI_ALLOWED_HOSTS: localhost
    volumes:
      # Volumes nommés : Docker les crée inscriptibles par Shiori. Un dossier de l'hôte
      # (`./data:/data`) que Docker crée lui-même appartient à root, et Shiori ne démarre pas.
      - shiori-data:/data # base SQLite (progression, métadonnées, couvertures) : à sauvegarder
      - shiori-cache:/cache # pages redimensionnées, se reconstruit tout seul
      # Vos fichiers, en lecture seule (jamais modifiés) ; dans Shiori, la bibliothèque se crée
      # avec le chemin de droite. Ils doivent être lisibles par tous (droits habituels).
      # - /chemin/vers/mangas:/bibliotheques/mangas:ro

volumes:
  shiori-data:
  shiori-cache:
