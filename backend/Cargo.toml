[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/befa160/shiori"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
alphanumeric-sort = "1.5"
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
clap = { version = "4.6", features = ["derive"] }
comfy-table = "8.0"
directories = "6.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
imagesize = "0.15"
ravif = { version = "0.13", default-features = false, features = ["threading"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tokio = "1.54"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
shiori-db = { path = "crates/shiori-db" }
shiori-core = { path = "crates/shiori-core" }
blake3 = { version = "1.8", default-features = false, features = ["std", "pure"] }
thiserror = "2.0"
rars = { version = "0.12", default-features = false }
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "lzma", "xz", "ppmd"] }
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace"] }
http-body-util = "0.1"
shiori-testkit = { path = "crates/shiori-testkit" }

# Les fixtures encodent des centaines d'images : on optimise les dépendances même en
# debug, sinon les tests passent leur temps dans l'encodeur PNG.
[profile.dev.package."*"]
opt-level = 3
