[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/befa160/shiori"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
alphanumeric-sort = "1.5"
anyhow = "1.0"
# Mots de passe (Argon2id, pur Rust) ; le sel vient de getrandom.
argon2 = "0.6"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
clap = { version = "4.6", features = ["derive", "env"] }
comfy-table = "8.0"
directories = "6.0"
# Hasard du système pour les jetons de session et les mots de passe provisoires.
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
imagesize = "0.15"
log = "0.4"
ravif = { version = "0.13", default-features = false, features = ["threading"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.42", features = ["serialize"] }
# Client HTTP synchrone, rustls + ring (pur Rust côté build, pas de cmake sous Windows).
ureq = "3.5"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tokio = "1.54"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webbrowser = { version = "1.2.7", features = ["hardened"] }
# Surveillance des dossiers (lot 9.1) : inotify, ReadDirectoryChangesW, FSEvents.
notify = "9.0"
shiori-db = { path = "crates/shiori-db" }
shiori-core = { path = "crates/shiori-core" }
shiori-meta = { path = "crates/shiori-meta" }
blake3 = { version = "1.8", default-features = false, features = ["std", "pure"] }
thiserror = "2.0"
# Double authentification (lot 7.5) : TOTP RFC 6238, et le QR de l'enrôlement en SVG (sans image).
totp-rs = { version = "6.0", default-features = false, features = ["std", "otpauth"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rars = { version = "0.12", default-features = false }
# PDF (phase 8) : analyse paresseuse et interprétation des pages, pur Rust. Les 14 polices
# standard embarquées (300 Kio) font produire des glyphes au texte en Helvetica non inclus :
# sans elles, ce texte visible échapperait au diagnostic `pdf_text_ignored`.
hayro-interpret = { version = "0.9.0", default-features = false, features = ["embed-fonts"] }
crc32fast = "1.5"
# Fixtures PDF du testkit.
pdf-writer = "0.15"
rust-embed = { version = "8.14", default-features = false, features = ["mime-guess"] }
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "lzma", "xz", "ppmd"] }
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "fs", "trace"] }
http-body-util = "0.1"
# Boucle de service avec délai de lecture des en-têtes (axum::serve n'en pose aucun).
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service", "server-graceful", "http1"] }
shiori-testkit = { path = "crates/shiori-testkit" }

# Les fixtures encodent des centaines d'images : on optimise les dépendances même en
# debug, sinon les tests passent leur temps dans l'encodeur PNG.
[profile.dev.package."*"]
opt-level = 3

# Numéros de ligne seulement (backtraces lisibles) : les infos de debug complètes faisaient
# grossir `target/` de dizaines de Go sur une petite machine.
[profile.dev]
debug = "line-tables-only"
